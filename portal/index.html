<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Client Portal — Multiply Local</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #1c1c1c;
    --black-light: #232323;
    --black-card: #272727;
    --black-mid: #2e2e2e;
    --red: #c23b2e;
    --red-dark: #9e2f25;
    --red-bright: #d44638;
    --cream: #f5f0e8;
    --white: #faf7f2;
    --gray: #777;
    --gray-dark: #555;
    --gray-muted: #444;
    --gray-light: #999;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--black);
    color: var(--cream);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { text-decoration: none; color: inherit; }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--black-mid);
  }
  .header-logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.08em; color: var(--cream); }
  .header-logo .x { color: var(--red); }
  .header-tag {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gray-light);
  }

  .main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
  }
  .card {
    background: var(--black-card);
    border: 1px solid var(--black-mid);
    border-radius: 8px;
    padding: 48px 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .card h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 40px;
    letter-spacing: 0.06em;
    line-height: 1.1;
    margin-bottom: 12px;
  }
  .card h1 .accent { color: var(--red); }
  .card p {
    color: var(--gray-light);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .btn {
    display: inline-block;
    font-family: 'Oswald', sans-serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    background: var(--red);
    color: var(--cream);
    padding: 14px 32px;
    border-radius: 3px;
    border: none;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .btn:hover { background: var(--red-bright); transform: translateY(-1px); }

  .footer {
    text-align: center;
    padding: 24px;
    font-size: 12px;
    color: var(--gray-dark);
    border-top: 1px solid var(--black-mid);
  }
  .footer a { color: var(--gray-light); }
  .footer a:hover { color: var(--cream); }
</style>
</head>
<body>

  <header class="header">
    <a class="header-logo" href="/">MULTIPLY<span class="x">X</span>LOCAL</a>
    <span class="header-tag">Client Portal</span>
  </header>

  <main class="main">
    <div class="card">
      <h1>Client <span class="accent">Portal</span></h1>
      <p>Your project dashboard, reports, and deliverables — all in one place. The portal is under construction and launching soon.</p>
      <a class="btn" href="https://www.multiplylocal.com/contact">Contact Us</a>
    </div>
  </main>

  <footer class="footer">
    &copy; 2026 Multiply Local &middot; <a href="https://www.multiplylocal.com">multiplylocal.com</a>
  </footer>

</body>
</html>
